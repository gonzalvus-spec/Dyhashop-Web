<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ban-title ban-desc">
  <title id="ban-title">Dyha Shop — Detalles inolvidables</title>
  <desc id="ban-desc">Banner animado: una caja de regalo blanca con lazo carmesí, tapa entreabierta que se eleva en bucle, destellos centelleantes y un anillo orbital de destellos girando alrededor.</desc>

  <style>
    .bd-lid   { animation: bdLid 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .bd-bow   { animation: bdBow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 92%; }
    .bd-spark { animation: bdTwinkle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; animation-delay: var(--d, 0s); }
    .bd-orbit { animation: bdOrbit 36s linear infinite; transform-box: fill-box; transform-origin: center; }
    .bd-float { animation: bdFloat 5s ease-in-out infinite; transform-box: fill-box; }
    @keyframes bdLid     { 0%,100% { transform: translateY(3px) } 50% { transform: translateY(-8px) } }
    @keyframes bdBow     { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(5deg) } }
    @keyframes bdTwinkle { 0%,100% { opacity: .3; transform: scale(.65) rotate(0deg) } 50% { opacity: 1; transform: scale(1.18) rotate(18deg) } }
    @keyframes bdOrbit   { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    @keyframes bdFloat   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <defs>
    <radialGradient id="ban-glow-r" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFE4E6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE4E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ban-glow-l" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFF1F2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF1F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ban-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ban-bg)"/>
  <ellipse cx="1085" cy="-40" rx="330" ry="230" fill="url(#ban-glow-r)"/>
  <ellipse cx="-80" cy="640" rx="330" ry="230" fill="url(#ban-glow-l)"/>

  <!-- Texto -->
  <text x="80" y="158" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="25" font-weight="800" letter-spacing="7" fill="#BE123C">DETALLES HECHOS A MEDIDA</text>

  <text x="76" y="312" font-family="'Great Vibes', cursive" font-size="140" fill="#111827">dyha shop</text>

  <path d="M84 338h300" stroke="#E11D48" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M118 352h180" stroke="#E11D48" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>

  <text x="80" y="440" font-family="'Fraunces', Georgia, serif" font-style="italic" font-size="42" fill="#BE123C">detalles que se recuerdan</text>

  <text x="80" y="530" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="600" letter-spacing="1" fill="#4B5563">Cajas sorpresa  ·  Regalos a medida  ·  Dedicatorias caligráficas</text>

  <!-- Sello flotante -->
  <g class="bd-float" transform="translate(548 470)">
    <rect width="188" height="46" rx="23" fill="#FFFFFF" stroke="#EFEFEF"/>
    <circle cx="24" cy="23" r="13" fill="#FFF1F2"/>
    <path d="M24 14l2.1 5.6 5.9 2.1-5.9 2.1L24 29.6l-2.1-5.8-5.9-2.1 5.9-2.1L24 14Z" fill="#E11D48"/>
    <text x="46" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#111827">Hecho a mano</text>
  </g>

  <!-- Anillo orbital de destellos y confeti alrededor de la caja -->
  <g class="bd-orbit" aria-hidden="true">
    <ellipse cx="950" cy="330" rx="212" ry="196" fill="none" stroke="#FDA4AF" stroke-width="1.4" stroke-dasharray="2 11" stroke-linecap="round" opacity="0.8"/>
    <path d="M738 320 C740 328 742.5 331 750 333 C742.5 335 740 338 738 346 C736 338 733.5 335 726 333 C733.5 331 736 328 738 320 Z" fill="#FBBF24" opacity="0.95"/>
    <path d="M1162 320 C1164 328 1166.5 331 1174 333 C1166.5 335 1164 338 1162 346 C1160 338 1157.5 335 1150 333 C1157.5 331 1160 328 1162 320 Z" fill="#F43F5E" opacity="0.95"/>
    <path d="M950 134 C952 143 955 147 963 149 C955 151 952 155 950 164 C948 155 945 151 937 149 C945 147 948 143 950 134 Z" fill="#FBBF24" opacity="0.95"/>
    <path d="M950 496 C952 505 955 509 963 511 C955 513 952 517 950 526 C948 517 945 513 937 511 C945 509 948 505 950 496 Z" fill="#F43F5E" opacity="0.95"/>
    <circle cx="802" cy="192" r="5" fill="#FBBF24" opacity="0.9"/>
    <circle cx="1098" cy="192" r="5" fill="#FB7185" opacity="0.9"/>
    <circle cx="802" cy="468" r="5" fill="#FB7185" opacity="0.9"/>
    <circle cx="1098" cy="468" r="5" fill="#FBBF24" opacity="0.9"/>
  </g>

  <!-- Caja de regalo -->
  <ellipse cx="950" cy="556" rx="150" ry="15" fill="#111827" opacity="0.10"/>
  <g>
    <!-- Cuerpo -->
    <rect x="822" y="330" width="256" height="198" rx="17" fill="#FFFFFF" stroke="#111827" stroke-width="9"/>
    <rect x="933" y="332" width="34" height="194" fill="#E11D48"/>
    <rect x="824" y="414" width="252" height="32" fill="#E11D48"/>
    <path d="M850 356v132" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    <!-- Tapa entreabierta: posición base -->
    <g transform="rotate(-7 950 286)">
      <g class="bd-lid">
        <rect x="792" y="236" width="316" height="62" rx="19" fill="#FFFFFF" stroke="#111827" stroke-width="9"/>
        <rect x="933" y="238" width="34" height="58" fill="#E11D48"/>
        <!-- Lazo -->
        <g class="bd-bow">
          <path d="M950 236 C930 212 896 206 884 220 C873 233 902 250 950 248 Z" fill="#E11D48"/>
          <path d="M950 236 C970 212 1004 206 1016 220 C1027 233 998 250 950 248 Z" fill="#E11D48"/>
          <path d="M936 232 C926 225 914 223 906 227" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
          <path d="M964 232 C974 225 986 223 994 227" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
          <circle cx="950" cy="238" r="13" fill="#BE123C"/>
        </g>
      </g>
    </g>
    <!-- Destellos centelleantes -->
    <path class="bd-spark" style="--d:0s"    d="M760 176 C762 185 765 189 774 191 C765 193 762 197 760 206 C758 197 755 193 746 191 C755 189 758 185 760 176 Z" fill="#FBBF24"/>
    <path class="bd-spark" style="--d:1.2s"  d="M1182 290 C1184 298 1187 301 1195 303 C1187 305 1184 309 1182 317 C1180 309 1177 305 1169 303 C1177 301 1180 298 1182 290 Z" fill="#FBBF24"/>
    <path class="bd-spark" style="--d:2.1s"  d="M1146 520 C1148 527 1150 530 1157 532 C1150 534 1148 537 1146 545 C1144 537 1142 534 1135 532 C1142 530 1144 527 1146 520 Z" fill="#FB7185"/>
  </g>
</svg>
